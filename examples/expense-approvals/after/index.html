<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Approvals · Acme Spend</title>
<script>
  // Theme override from the URL hash (#dark / #light) before first paint.
  (function () {
    var h = location.hash.slice(1);
    if (h === 'dark' || h === 'light') document.documentElement.dataset.theme = h;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root {
  color-scheme: light;

  /* Ramps (OKLCH, chroma clipped to sRGB). pine = primary + success, clay = danger, ochre = warning */
  --pine-50: oklch(0.970 0.025 160);  --pine-100: oklch(0.940 0.045 160); --pine-200: oklch(0.880 0.075 160);
  --pine-300: oklch(0.800 0.100 160); --pine-400: oklch(0.710 0.120 160); --pine-500: oklch(0.620 0.125 160);
  --pine-600: oklch(0.520 0.115 160); --pine-700: oklch(0.450 0.100 160); --pine-800: oklch(0.380 0.085 160);
  --pine-900: oklch(0.310 0.070 160); --pine-950: oklch(0.240 0.054 160);
  --pine-300-dk: oklch(0.800 0.085 160); --pine-400-dk: oklch(0.710 0.102 160); /* dark-mode accent, chroma -15% */
  --clay-50: oklch(0.970 0.015 27);  --clay-100: oklch(0.935 0.033 27); --clay-200: oklch(0.880 0.064 27);
  --clay-300: oklch(0.800 0.110 27); --clay-400: oklch(0.700 0.160 27); --clay-500: oklch(0.620 0.190 27);
  --clay-600: oklch(0.540 0.190 27); --clay-700: oklch(0.470 0.170 27); --clay-800: oklch(0.400 0.140 27);
  --clay-900: oklch(0.330 0.110 27); --clay-950: oklch(0.250 0.080 27);
  --ochre-50: oklch(0.975 0.018 70);  --ochre-100: oklch(0.950 0.037 70); --ochre-200: oklch(0.900 0.076 70);
  --ochre-300: oklch(0.840 0.126 70); --ochre-400: oklch(0.780 0.150 70); --ochre-500: oklch(0.700 0.150 70);
  --ochre-600: oklch(0.600 0.130 70); --ochre-700: oklch(0.520 0.110 70); --ochre-800: oklch(0.440 0.090 70);
  --ochre-900: oklch(0.360 0.075 70); --ochre-950: oklch(0.270 0.058 70);

  /* Neutrals, light: warm stone (h 85) */
  --frame: oklch(0.962 0.007 85);
  --bg: oklch(0.985 0.004 85);
  --surface: oklch(1 0 0);
  --subtle: oklch(0.955 0.007 85);
  --well: oklch(0.955 0.007 85);
  --paper: oklch(1 0 0);
  --border: oklch(0.905 0.008 85);
  --border-strong: oklch(0.830 0.010 85);
  --field-border: oklch(0.600 0.012 85);
  --fg-1: oklch(0.220 0.012 85);
  --fg-2: oklch(0.440 0.014 85);
  --fg-3: oklch(0.530 0.012 85);

  /* Roles */
  --accent: var(--pine-600); --accent-hover: var(--pine-700); --accent-press: var(--pine-800);
  --on-accent: oklch(1 0 0); --accent-text: var(--pine-700);
  --accent-tint: var(--pine-50); --accent-tint-fg: var(--pine-800); --ring: var(--pine-600);
  --ok-icon: var(--pine-600); --ok-tint: var(--pine-50); --ok-tint-fg: var(--pine-800);
  --warn-icon: var(--ochre-700); --warn-tint: var(--ochre-50); --warn-tint-fg: var(--ochre-800);
  --danger-text: var(--clay-700); --danger-line: var(--clay-600); --danger-fill: var(--clay-600);
  --danger-fill-hover: var(--clay-700); --on-danger: oklch(1 0 0);
  --danger-tint: var(--clay-50); --danger-tint-fg: var(--clay-800);
  --toast-bg: var(--fg-1); --toast-fg: var(--bg); --toast-action: var(--pine-300);
  --scrim: oklch(0.220 0.012 85 / 0.40);

  /* Elevation: one light from above; key + ambient */
  --shadow-color: 35 25% 14%;
  --shadow-1: 0 1px 2px hsl(var(--shadow-color) / .06), 0 1px 1px hsl(var(--shadow-color) / .04);
  --shadow-2: 0 2px 6px -1px hsl(var(--shadow-color) / .08), 0 1px 2px hsl(var(--shadow-color) / .05);
  --shadow-3: 0 8px 20px -4px hsl(var(--shadow-color) / .12), 0 2px 4px hsl(var(--shadow-color) / .05);
  --shadow-4: 0 14px 32px -8px hsl(var(--shadow-color) / .14), 0 3px 6px hsl(var(--shadow-color) / .04);
  --shadow-5: 0 24px 56px -12px hsl(var(--shadow-color) / .20), 0 4px 8px hsl(var(--shadow-color) / .03);
  --highlight: inset 0 1px 0 hsl(0 0% 100% / .18);

  /* Type */
  --font: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
  --text-xs: 12px;  --lh-xs: 16px;
  --text-sm: 14px;  --lh-sm: 20px;
  --text-base: 16px; --lh-base: 24px;
  --text-xl: 20px;  --lh-xl: 26px;
  --text-2xl: 24px; --lh-2xl: 30px;
  --w-regular: 400; --w-medium: 500; --w-semibold: 600;
  --track-caps: 0.06em;

  /* Space */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
  --space-6: 32px; --space-7: 48px; --space-8: 64px;

  /* Sizes */
  --h-sm: 32px; --h-md: 36px; --h-lg: 40px; --h-touch: 44px; --h-touch-lg: 48px;
  --avatar-sm: 24px; --avatar-md: 32px; --avatar-lg: 40px;
  --icon-sm: 16px; --icon-md: 20px;
  --icon-xs: 12px; --icon-mark: 20px; --icon-dot: 10px; --h-cell: 40px; --w-skel-summary: 240px; --w-skel-title: 120px;
  --h-chip: 20px; --h-topbar: 56px; --w-nav-drawer: 280px; --dot: 16px;
  --w-sidebar: 240px; --w-panel: 360px; --w-workspace: 1240px; --w-drawer: 400px; --w-search: 280px;

  /* Radius, borders */
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px; --radius-full: 9999px;
  --hairline: 1px; --bar: 3px; --ring-w: 2px;

  /* Motion */
  --dur-1: 100ms; --dur-2: 160ms; --dur-3: 240ms; --dur-4: 320ms; --dur-5: 480ms;
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);
  --move: 1; /* 0 under reduced motion: travel becomes opacity only */
}

/* Dark palette: forest night (h 165), its own values, not an inversion */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --frame: oklch(0.145 0.010 165); --bg: oklch(0.170 0.010 165); --surface: oklch(0.205 0.011 165);
    --subtle: oklch(0.245 0.011 165); --well: oklch(0.170 0.010 165); --paper: oklch(0.280 0.011 165);
    --border: oklch(0.300 0.012 165); --border-strong: oklch(0.380 0.012 165); --field-border: oklch(0.550 0.012 165);
    --fg-1: oklch(0.930 0.008 165); --fg-2: oklch(0.760 0.010 165); --fg-3: oklch(0.640 0.010 165);
    --accent: var(--pine-400-dk); --accent-hover: var(--pine-300-dk); --accent-press: var(--pine-200);
    --on-accent: var(--pine-950); --accent-text: var(--pine-300-dk);
    --accent-tint: var(--pine-950); --accent-tint-fg: var(--pine-200); --ring: var(--pine-400-dk);
    --ok-icon: var(--pine-400-dk); --ok-tint: var(--pine-950); --ok-tint-fg: var(--pine-200);
    --warn-icon: var(--ochre-400); --warn-tint: var(--ochre-950); --warn-tint-fg: var(--ochre-200);
    --danger-text: var(--clay-300); --danger-line: var(--clay-400); --danger-fill: var(--clay-400);
    --danger-fill-hover: var(--clay-300); --on-danger: var(--clay-950);
    --danger-tint: var(--clay-950); --danger-tint-fg: var(--clay-300);
    --toast-bg: var(--fg-1); --toast-fg: var(--bg); --toast-action: var(--pine-700);
    --scrim: oklch(0.100 0.010 165 / 0.60);
    --shadow-1: 0 0 #0000; --shadow-2: 0 0 #0000;
    --shadow-3: 0 8px 24px -4px oklch(0 0 0 / .45);
    --shadow-4: 0 14px 32px -8px oklch(0 0 0 / .55);
    --shadow-5: 0 24px 56px -12px oklch(0 0 0 / .60);
    --highlight: inset 0 1px 0 hsl(0 0% 100% / .06);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --frame: oklch(0.145 0.010 165); --bg: oklch(0.170 0.010 165); --surface: oklch(0.205 0.011 165);
  --subtle: oklch(0.245 0.011 165); --well: oklch(0.170 0.010 165); --paper: oklch(0.280 0.011 165);
  --border: oklch(0.300 0.012 165); --border-strong: oklch(0.380 0.012 165); --field-border: oklch(0.550 0.012 165);
  --fg-1: oklch(0.930 0.008 165); --fg-2: oklch(0.760 0.010 165); --fg-3: oklch(0.640 0.010 165);
  --accent: var(--pine-400-dk); --accent-hover: var(--pine-300-dk); --accent-press: var(--pine-200);
  --on-accent: var(--pine-950); --accent-text: var(--pine-300-dk);
  --accent-tint: var(--pine-950); --accent-tint-fg: var(--pine-200); --ring: var(--pine-400-dk);
  --ok-icon: var(--pine-400-dk); --ok-tint: var(--pine-950); --ok-tint-fg: var(--pine-200);
  --warn-icon: var(--ochre-400); --warn-tint: var(--ochre-950); --warn-tint-fg: var(--ochre-200);
  --danger-text: var(--clay-300); --danger-line: var(--clay-400); --danger-fill: var(--clay-400);
  --danger-fill-hover: var(--clay-300); --on-danger: var(--clay-950);
  --danger-tint: var(--clay-950); --danger-tint-fg: var(--clay-300);
  --toast-bg: var(--fg-1); --toast-fg: var(--bg); --toast-action: var(--pine-700);
  --scrim: oklch(0.100 0.010 165 / 0.60);
  --shadow-1: 0 0 #0000; --shadow-2: 0 0 #0000;
  --shadow-3: 0 8px 24px -4px oklch(0 0 0 / .45);
  --shadow-4: 0 14px 32px -8px oklch(0 0 0 / .55);
  --shadow-5: 0 24px 56px -12px oklch(0 0 0 / .60);
  --highlight: inset 0 1px 0 hsl(0 0% 100% / .06);
}
@media (prefers-reduced-motion: reduce) {
  :root { --move: 0; --dur-3: 160ms; --dur-4: 160ms; --dur-5: 160ms; }
}

/* ============ BASE ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); }
body {
  font-family: var(--font); font-size: var(--text-sm); line-height: var(--lh-sm); font-weight: var(--w-regular);
  color: var(--fg-1); background: var(--bg); -webkit-font-smoothing: antialiased; min-height: 100vh;
}
.amt, .total, .summary strong, .big, .receipt .ln span:last-child, .receipt .tot span:last-child, .count, .segmented b { font-variant-numeric: tabular-nums; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
svg.i { width: var(--icon-sm); height: var(--icon-sm); flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.skip { position: fixed; left: var(--space-4); top: var(--space-4); z-index: 70; transform: translateY(-200%); background: var(--surface); color: var(--fg-1); padding: var(--space-2) var(--space-4); border-radius: var(--radius-md); box-shadow: var(--shadow-3); font-weight: var(--w-medium); }
.skip:focus-visible { transform: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: var(--ring-w) solid var(--ring); outline-offset: var(--ring-w); }
a { color: inherit; text-decoration: none; }

/* ============ BUTTONS ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  height: var(--h-md); padding: 0 var(--space-4); border-radius: var(--radius-md);
  font-size: var(--text-sm); line-height: var(--lh-sm); font-weight: var(--w-medium); white-space: nowrap;
  transition: background-color var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out),
              color var(--dur-2) var(--ease-out), transform var(--dur-1) var(--ease-out);
}
.btn:active:not(:disabled) { transform: translateY(calc(var(--move) * 1px)); }
.btn:disabled { background: var(--subtle); color: var(--fg-3); border-color: transparent; box-shadow: none; cursor: not-allowed; }
.btn[aria-busy="true"] { cursor: progress; }
.btn[aria-busy="true"]::before {
  content: ""; width: 14px; height: 14px; border-radius: var(--radius-full);
  border: 2px solid currentColor; border-right-color: transparent; animation: spin 800ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--highlight), var(--shadow-1); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-primary:active:not(:disabled) { background: var(--accent-press); }
.btn-secondary { background: var(--surface); color: var(--fg-1); border: var(--hairline) solid var(--border-strong); box-shadow: var(--shadow-1); }
.btn-secondary:hover:not(:disabled) { background: var(--subtle); }
.btn-ghost { color: var(--fg-2); }
.btn-ghost:hover:not(:disabled) { background: var(--subtle); color: var(--fg-1); }
.btn-ghost:active:not(:disabled) { background: var(--border); }
.btn-danger-outline { color: var(--danger-text); border: var(--hairline) solid var(--danger-line); background: transparent; }
.btn-danger-outline:hover:not(:disabled) { background: var(--danger-tint); }
.btn-danger-outline:active:not(:disabled) { background: var(--danger-tint); border-color: var(--danger-text); }
.btn-danger { background: var(--danger-fill); color: var(--on-danger); box-shadow: var(--highlight), var(--shadow-1); }
.btn-danger:hover:not(:disabled) { background: var(--danger-fill-hover); }
.btn-icon { width: var(--h-md); padding: 0; color: var(--fg-2); }
.btn-icon:hover:not(:disabled) { background: var(--subtle); color: var(--fg-1); }
.btn-lg { height: var(--h-lg); }

/* Tooltips: 500ms on hover, instant on keyboard focus */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + var(--space-2)); z-index: 30;
  transform: translate(-50%, calc(var(--move) * 4px)); opacity: 0; pointer-events: none; white-space: nowrap;
  background: var(--toast-bg); color: var(--toast-fg); font-size: var(--text-xs); line-height: var(--lh-xs);
  font-weight: var(--w-medium); padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); box-shadow: var(--shadow-3);
  transition: opacity var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out);
}
[data-tip][data-tip-pos="below"]::after { bottom: auto; top: calc(100% + var(--space-2)); }
[data-tip][data-tip-pos="start"]::after { left: auto; right: 0; transform: translate(0, calc(var(--move) * 4px)); }
[data-tip]:hover::after { opacity: 1; transform: translate(-50%, 0); transition-delay: 500ms; }
[data-tip][data-tip-pos="start"]:hover::after, [data-tip][data-tip-pos="start"]:focus-visible::after { transform: translate(0, 0); }
[data-tip]:focus-visible::after { opacity: 1; transform: translate(-50%, 0); transition-delay: 0s; }

/* ============ CHIPS, AVATARS ============ */
.chip {
  display: inline-flex; align-items: center; gap: var(--space-1); height: var(--h-chip); padding: 0 var(--space-2);
  border-radius: var(--radius-sm); font-size: var(--text-xs); line-height: var(--lh-xs); font-weight: var(--w-medium);
  background: var(--subtle); color: var(--fg-2); white-space: nowrap; flex: none;
}
.chip svg.i { width: var(--icon-xs); height: var(--icon-xs); stroke-width: 2; }
.chip-warn { background: var(--warn-tint); color: var(--warn-tint-fg); }
.chip-ok { background: var(--ok-tint); color: var(--ok-tint-fg); }
.chip-danger { background: var(--danger-tint); color: var(--danger-tint-fg); }
.avatar {
  width: var(--avatar-md); height: var(--avatar-md); border-radius: var(--radius-full); flex: none;
  display: grid; place-items: center; background: var(--subtle); color: var(--fg-2);
  font-size: var(--text-xs); font-weight: var(--w-semibold); letter-spacing: var(--track-caps);
  box-shadow: inset 0 0 0 var(--hairline) var(--border);
}
.avatar-lg { width: var(--avatar-lg); height: var(--avatar-lg); font-size: var(--text-sm); }

/* ============ APP FRAME ============ */
.app { display: grid; grid-template-columns: var(--w-sidebar) minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; background: var(--frame); display: flex; flex-direction: column;
  padding: var(--space-5) var(--space-3) var(--space-4); gap: var(--space-5);
}
.brand { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-2); }
.brand-mark { width: var(--avatar-md); height: var(--avatar-md); border-radius: var(--radius-md); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; box-shadow: var(--highlight); }
.brand-mark svg { width: var(--icon-mark); height: var(--icon-mark); fill: currentColor; stroke: none; }
.brand-name { font-weight: var(--w-semibold); }
.brand-org { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--fg-2); }
.nav { display: flex; flex-direction: column; gap: var(--space-1); }
.nav a {
  display: flex; align-items: center; gap: var(--space-3); height: var(--h-md); padding: 0 var(--space-3);
  border-radius: var(--radius-md); color: var(--fg-2); font-weight: var(--w-medium);
  transition: background-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
}
.nav a:hover { background: var(--subtle); color: var(--fg-1); }
.nav a[aria-current="page"] { background: var(--surface); color: var(--fg-1); font-weight: var(--w-semibold); box-shadow: inset var(--bar) 0 0 var(--accent), var(--shadow-1); }
.nav a[aria-current="page"] svg { color: var(--accent-text); }
.nav .count { margin-left: auto; min-width: var(--h-chip); height: var(--h-chip); padding: 0 var(--space-1); border-radius: var(--radius-full); background: var(--accent-tint); color: var(--accent-tint-fg); font-size: var(--text-xs); line-height: var(--h-chip); text-align: center; font-weight: var(--w-semibold); }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--space-4); }
.account { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-2) 0; border-top: var(--hairline) solid var(--border); }
.account .who { flex: 1; min-width: 0; }
.account .role { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--fg-2); }
.topbar { display: none; }
.scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity var(--dur-3) var(--ease-out); z-index: 40; }
.scrim.on { opacity: 1; pointer-events: auto; }

/* ============ WORKSPACE ============ */
.main { padding: var(--space-6) var(--space-6) var(--space-7); min-width: 0; }
.workspace { max-width: var(--w-workspace); margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr) var(--w-panel); gap: var(--space-5); align-items: start; }
.queue { min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); }
.page-head h1 { font-size: var(--text-2xl); line-height: var(--lh-2xl); font-weight: var(--w-semibold); letter-spacing: -0.01em; }
.summary { margin-top: var(--space-1); color: var(--fg-2); }
.summary strong { color: var(--fg-1); font-weight: var(--w-semibold); }
.toolbar { margin-top: var(--space-5); display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }

.segmented { display: inline-flex; padding: 2px; gap: 2px; background: var(--subtle); border-radius: var(--radius-md); border: 0; }
.segmented label { position: relative; }
.segmented input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.segmented span {
  display: inline-flex; align-items: center; gap: var(--space-2); height: var(--h-sm); padding: 0 var(--space-3);
  border-radius: calc(var(--radius-md) - 2px); color: var(--fg-2); font-weight: var(--w-medium);
  transition: background-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
}
.segmented b { font-weight: var(--w-medium); color: var(--fg-3); }
.segmented label:hover span { color: var(--fg-1); }
.segmented input:checked + span { background: var(--surface); color: var(--fg-1); box-shadow: var(--shadow-1), inset 0 0 0 var(--hairline) var(--border); }
.segmented input:checked + span b { color: var(--fg-2); }
.segmented input:focus-visible + span { outline: var(--ring-w) solid var(--ring); outline-offset: 0; }

.search { position: relative; flex: 0 1 var(--w-search); }

<script>
(function () {
  'use strict';
  const NOW = new Date('2026-11-23T18:00:00Z');   // fixed "now" so screenshots are deterministic
  const TZ = 'America/Los_Angeles';
  const params = new URLSearchParams(location.search);
  const MODE = params.get('state');               // loading | empty
  const FAIL = params.has('fail');                // simulate a server that refuses approvals
  const UNDO_MS = 6000;

  const R = [
    { id: 'r1', name: 'Priya Raman', desc: 'Flight SEA → DEN, regional sales summit', cat: 'Travel', amt: 124860, at: '2026-11-21T09:42:17Z', status: 'waiting',
      receipt: { merchant: 'Cascade Air', detail: 'SEA → DEN · Economy · Dec 3', lines: [['Fare', 110200], ['Taxes and fees', 14660]] },
      note: 'Booked three weeks out; cheapest nonstop that day.',
      policy: { ok: true, title: 'Within policy', detail: 'Airfare cap $1,500 economy · $251.40 under' } },
    { id: 'r2', name: 'Tomás Herrera', desc: 'Client dinner – Alder & Pine (4 guests)', cat: 'Meals', amt: 32640, at: '2026-11-20T21:15:03Z', status: 'waiting',
      receipt: { merchant: 'Alder & Pine', detail: 'Table 12 · 4 guests · Nov 20', lines: [['Dinner', 27800], ['Tip', 4840]] },
      note: 'Closing dinner with the Ridgeline Outfitters buyers.',
      policy: { ok: false, over: 2640, title: 'Over policy by $26.40', detail: 'Client meals $75 a guest · 4 guests = $300.00' }, suggest: 'Over policy limit' },
    { id: 'r3', name: 'Jun Watanabe', desc: 'Figma Professional – annual seat', cat: 'Software', amt: 18000, at: '2026-11-20T14:08:51Z', status: 'waiting',
      receipt: { merchant: 'Figma', detail: 'Professional · 1 editor · annual', lines: [['12 months × $15.00', 18000]] },
      note: 'Replaces the shared login we used for product sheets.',
      policy: { ok: true, title: 'Within policy', detail: 'Software under $500 needs only your approval' } },
    { id: 'r4', name: 'Amara Nwosu', desc: 'Wilderness First Responder recertification', cat: 'Training', amt: 231000, at: '2026-11-19T16:30:00Z', status: 'waiting',
      receipt: { merchant: 'Backcountry Medicine Institute', detail: 'WFR recert · 3 days · Jan 9–11', lines: [['Course', 214000], ['Materials', 17000]] },
      note: 'Required to guide the spring river trips.',
      policy: { ok: true, title: 'Within policy', detail: 'Training budget $2,500 a year · $190.00 left after this' } },
    { id: 'r5', name: 'Ellis Brandt', desc: 'Rideshare, airport → hotel', cat: 'Travel', amt: 4793, at: '2026-11-18T23:51:44Z', status: 'waiting',
      receipt: { merchant: 'Rideshare', detail: 'DEN airport → Larimer Hotel · 11:58 PM', lines: [['Fare', 3943], ['Tip', 850]] },
      note: 'Landed at 11:40 PM; the hotel shuttle had stopped.',
      policy: { ok: true, title: 'Within policy', detail: 'Ground transport · receipt attached' } },
    { id: 'r6', name: 'Sofia Lindqvist', desc: '27" monitor for home office', cat: 'Equipment', amt: 41200, at: '2026-11-17T10:12:29Z', status: 'approved', decidedAt: '2026-11-18T17:05:00Z', stage: 2,
      receipt: { merchant: 'Summit Office Supply', detail: '27" 4K monitor · order 48117', lines: [['Monitor', 38000], ['Sales tax', 3200]] },
      note: 'Home office setup for remote weeks.',
      policy: { ok: true, title: 'Within policy', detail: 'Equipment under $500 · approved by you' } },
    { id: 'r7', name: 'Dev Malhotra', desc: 'Hotel, 2 nights – Boulder trade show', cat: 'Travel', amt: 53822, at: '2026-11-15T08:03:12Z', status: 'approved', decidedAt: '2026-11-16T16:20:00Z', stage: 4, paidAt: '2026-11-21T16:00:00Z',
      receipt: { merchant: 'Boulder Creek Lodge', detail: '2 nights · Nov 12–14', lines: [['Room × 2', 46800], ['Taxes', 7022]] },
      note: 'Trade show block rate.',
      policy: { ok: true, title: 'Within policy', detail: 'Lodging cap $300 a night · $269.11 a night' } },
    { id: 'r8', name: 'Hannah Cole', desc: 'Team lunch (no itemized receipt)', cat: 'Meals', amt: 21475, at: '2026-11-14T13:27:40Z', status: 'returned', decidedAt: '2026-11-15T18:10:00Z', reason: 'No itemized receipt',
      receipt: null,
      note: 'Team lunch after the inventory count.',
      policy: { ok: false, title: 'Itemized receipt required', detail: 'Meals over $75 need an itemized receipt' } }
  ];
  if (MODE === 'empty') R.forEach(r => { if (r.status === 'waiting') { r.status = 'approved'; r.decidedAt = '2026-11-22T17:00:00Z'; r.stage = 2; } });

  const SEP = '<span class="sep" aria-hidden="true">·</span>';
  const REASONS = ['No itemized receipt', 'Over policy limit', 'Personal expense', 'Needs more detail'];
  const $ = s => document.querySelector(s);
  const money = c => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(c / 100);
  const ymd = d => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
  const days = iso => Math.round((Date.parse(ymd(NOW)) - Date.parse(ymd(new Date(iso)))) / 864e5);
  const ago = iso => { const n = days(iso); return n <= 0 ? 'Today' : n === 1 ? 'Yesterday' : n + ' days'; };
  const full = iso => new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' }).format(new Date(iso));
  const short = iso => new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' }).format(new Date(iso));
  const md = iso => new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric' }).format(new Date(iso));
  const initials = n => n.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
  const first = n => n.split(' ')[0];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const icon = (id, cls = 'i') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
  const byId = id => R.find(r => r.id === id);
  const waiting = () => R.filter(r => r.status === 'waiting').sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
  const decided = () => R.filter(r => r.status !== 'waiting').sort((a, b) => Date.parse(b.decidedAt) - Date.parse(a.decidedAt));

  const S = { seg: 'all', q: '', selectedId: null, picked: new Set(), returning: false, reason: null, msg: '' };
  S.selectedId = (waiting()[0] || decided()[0] || {}).id || null;
  const narrow = () => matchMedia('(max-width: 1099px)').matches;

  function matches(r) {
    if (!S.q) return true;
    const q = S.q.toLowerCase();
    return [r.name, r.desc, r.cat].some(v => v.toLowerCase().includes(q));
  }

  /* ---------- summary ---------- */
  function renderSummary() {
    if (MODE === 'loading') { $('#summary').innerHTML = '<span class="skel" style="display:inline-block;width:var(--w-skel-summary);vertical-align:middle"></span>'; $('#navCount').hidden = true; document.querySelectorAll('[data-count]').forEach(b => b.textContent = ''); return; }
    const w = waiting();
    const total = w.reduce((s, r) => s + r.amt, 0);
    $('#summary').innerHTML = w.length
      ? `${w.length} waiting on you${SEP}<strong>${money(total)}</strong>${SEP}<span class="nowrap">oldest ${ago(w[0].at).toLowerCase()}</span>`
      : `Nothing waiting on you${SEP}${decided().length} decided in the last two weeks`;
    $('#navCount').textContent = w.length;
    $('#navCount').hidden = !w.length;
    document.querySelector('[data-count="all"]').textContent = R.length;
    document.querySelector('[data-count="waiting"]').textContent = w.length;
    document.querySelector('[data-count="decided"]').textContent = R.length - w.length;
  }

  /* ---------- list ---------- */
  function rowHTML(r) {
    const isW = r.status === 'waiting';
    const cur = r.id === S.selectedId ? ' aria-current="true"' : '';
    const flag = isW && r.policy && r.policy.over ? `<span class="chip chip-warn">${icon('alert')}Over by ${money(r.policy.over)}</span>` : '';
    const when = isW ? '' : days(r.decidedAt) <= 0 ? 'today' : md(r.decidedAt);
    const status = isW ? '' : r.status === 'approved'
      ? `<span class="chip chip-ok" title="Approved ${esc(full(r.decidedAt))}">${icon('check')}Approved ${when}</span>`
      : `<span class="chip chip-danger" title="Returned ${esc(full(r.decidedAt))}: ${esc(r.reason || '')}">${icon('return')}Returned ${when}</span>`;
    return `<li class="row${isW ? '' : ' decided'}${S.picked.has(r.id) ? ' selected' : ''}" data-id="${r.id}"${cur}>
      ${isW ? `<label class="check"><input type="checkbox" data-pick="${r.id}" ${S.picked.has(r.id) ? 'checked' : ''} aria-label="Select ${esc(r.name)}, ${money(r.amt)}"></label>` : '<span></span>'}
      <button class="row-main" type="button" data-open="${r.id}">
        <span class="avatar" aria-hidden="true">${initials(r.name)}</span>
        <span class="rw">
          <span class="name">${esc(r.name)}</span><span class="chips"><span class="chip">${esc(r.cat)}</span>${flag}</span>
          <span class="desc" title="${esc(r.desc)}">${esc(r.desc)}</span>
        </span>
        <span class="fig"><span class="amt">${money(r.amt)}</span>${isW ? `<span class="age" title="Submitted ${esc(full(r.at))}">${ago(r.at)}</span>` : status}</span>
      </button>
      ${isW && r.policy.ok ? `<button class="quick" type="button" data-quick="${r.id}" aria-label="Approve ${money(r.amt)} for ${esc(r.name)}" data-tip="Approve ${money(r.amt)}" data-tip-pos="start">${icon('check')}</button>` : '<span></span>'}
    </li>`;
  }

  const PINES = `<svg class="art" viewBox="0 0 120 64" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="92" cy="16" r="7"/><path d="M4 58h112"/>
      <path d="M34 8 22 26h6L16 42h8L12 58h44L44 42h8L40 26h6Z"/><path d="M34 58v4"/>
      <path d="M66 22l-8 12h4l-8 12h5l-7 12h28l-7-12h5l-8-12h4Z"/><path d="M66 58v4"/></svg>`;

  function renderList() {
    const list = $('#list');
    if (MODE === 'loading') {
      list.classList.add('loading');
      list.innerHTML = `<div class="group-head"><span></span><div class="title"><span class="skel" style="width:var(--w-skel-title)"></span></div><span></span></div>` +
        Array.from({ length: 5 }, () => `<div class="skel-row"><span></span><span class="skel-circle"></span><span style="display:grid;gap:var(--space-2)"><span class="skel" style="width:40%"></span><span class="skel" style="width:70%"></span></span><span class="skel"></span><span></span></div>`).join('');
      return;
    }
    list.classList.remove('loading');
    const w = waiting().filter(matches), d = decided().filter(matches);
    const showW = S.seg !== 'decided', showD = S.seg !== 'waiting';
    const head = (id, title, meta, check, total) => `<div class="group-head">${check || '<span></span>'}
      <div class="inner"><div class="title"><h2 id="${id}">${title}</h2><span class="meta">${meta}</span></div>${total ? `<span class="total">${total}</span>` : ''}</div><span></span></div>`;
    const groups = [];
    if (showW && w.length) {
      const allPicked = w.every(r => S.picked.has(r.id));
      const check = `<label class="check"><input type="checkbox" id="pickAll" ${allPicked ? 'checked' : ''} aria-label="Select all ${w.length} waiting"></label>`;
      groups.push(`<section class="group" aria-labelledby="gW">${head('gW', 'Waiting on you', 'Oldest first', check, money(w.reduce((s, r) => s + r.amt, 0)))}<ul class="rows">${w.map(rowHTML).join('')}</ul></section>`);
    } else if (showW && !S.q) {
      groups.push(`<section class="group" aria-labelledby="gW">${head('gW', 'Waiting on you', '')}<div class="empty">${PINES}<h3>You're all caught up</h3><p>New requests from your team land here, oldest first, with the receipt and policy check beside each one.</p>${showD ? '' : '<button class="btn btn-secondary" type="button" data-seg="decided">See decided requests</button>'}</div></section>`);
    }
    if (showD && d.length) {
      groups.push(`<section class="group" aria-labelledby="gD">${head('gD', 'Recently decided', 'Last two weeks')}<ul class="rows">${d.map(rowHTML).join('')}</ul></section>`);
    } else if (showD && !S.q) {
      groups.push(`<section class="group" aria-labelledby="gD">${head('gD', 'Recently decided', '')}<div class="empty"><p>Requests you approve or return show up here.</p></div></section>`);
    }
    list.innerHTML = groups.length ? groups.join('') : noResults();
    syncPickAll();
  }
  function noResults() {
    return `<div class="empty"><h3>No requests match “${esc(S.q)}”</h3><p>Search covers names, descriptions, and categories.</p><button class="btn btn-secondary" type="button" data-clear>Clear search</button></div>`;
  }

  /* ---------- panel ---------- */
  function track(r) {
    const steps = [['Submitted', md(r.at)], ['Your review', ''], ['Finance', ''], ['Paid', '']];
    let cls;
    if (r.status === 'waiting') { cls = ['done', 'current', 'todo', 'todo']; steps[1][1] = ago(r.at); }
    else if (r.status === 'returned') { cls = ['done', 'returned', 'todo', 'todo']; steps[1] = ['Returned', md(r.decidedAt)]; }
    else {
      const s = r.stage || 2; cls = steps.map((_, i) => i < s ? 'done' : i === s ? 'current' : 'todo');
      steps[1][1] = md(r.decidedAt); if (s === 2) steps[2][1] = 'Now'; if (r.paidAt) { steps[2][1] = ''; steps[3][1] = md(r.paidAt); cls[3] = 'done'; }
    }
    return `<ol class="track" aria-label="Progress">${steps.map((s, i) => `<li class="${cls[i]}"><span class="dot">${cls[i] === 'done' ? icon('check') : ''}</span><span class="st">${s[0]}</span><span>${s[1] || '&nbsp;'}</span></li>`).join('')}</ol>`;
  }
  function receiptHTML(r) {
    if (!r.receipt) return `<div class="no-receipt">${icon('receipt')}<div><strong>No itemized receipt</strong><div>Only the card slip was uploaded.</div></div></div>`;
    const x = r.receipt;
    return `<div class="receipt-well"><div class="receipt" role="img" aria-label="Receipt from ${esc(x.merchant)}, total ${money(r.amt)}">
      <div class="merchant">${esc(x.merchant)}</div><div class="rdetail">${esc(x.detail).replace(/ · /g, SEP)}</div>
      <div class="lines">${x.lines.map(l => `<div class="ln"><span>${esc(l[0])}</span><span>${money(l[1])}</span></div>`).join('')}</div>
      <div class="tot"><span>Total</span><span>${money(r.amt)}</span></div></div></div>`;
  }
  function footHTML(r) {
    const fn = first(r.name);
    if (r.status === 'approved') {
      return `<div class="panel-foot"><div class="decided-note">${icon('check-circle')}<span>Approved by you ${short(r.decidedAt)}. ${r.paidAt ? 'Paid out ' + short(r.paidAt) + '.' : 'Finance pays it in the next run.'}</span></div></div>`;
    }
    if (r.status === 'returned') {
      const said = r.message ? ` You wrote: “${esc(r.message)}”` : '';
      return `<div class="panel-foot"><div class="decided-note">${icon('return')}<span>Returned to ${esc(fn)} ${short(r.decidedAt)}: ${esc(r.reason)}.${said} Waiting on ${esc(fn)} to resubmit.</span></div></div>`;
    }
    if (S.returning) {
      return `<div class="panel-foot">
        <fieldset class="reasons"><legend>Why are you returning this?</legend>
          ${REASONS.map(x => `<label><input type="radio" name="reason" value="${x}" ${S.reason === x ? 'checked' : ''}><span>${x}</span></label>`).join('')}
        </fieldset>
        <div class="field"><label for="retMsg">Message to ${esc(fn)} <span style="color:var(--fg-3)">(optional)</span></label>
          <textarea id="retMsg" placeholder="e.g. Please add the itemized receipt from the restaurant.">${esc(S.msg)}</textarea></div>
        <div class="actions"><button class="btn btn-ghost btn-lg" type="button" data-cancel-return>Cancel</button>
          <button class="btn btn-danger btn-lg grow" type="button" data-confirm-return="${r.id}" ${S.reason ? '' : 'disabled'}>Return to ${esc(fn)}</button></div>
        <p class="reassure">${esc(fn)} gets your reason and message and can resubmit. Undo for 6 seconds.</p></div>`;
    }
    const demote = S.picked.size > 0;
    return `<div class="panel-foot"><div class="actions">
        <button class="btn btn-danger-outline btn-lg" type="button" data-return="${r.id}">Return…</button>
        <button class="btn ${demote ? 'btn-secondary' : 'btn-primary'} btn-lg grow" type="button" data-approve="${r.id}">Approve ${money(r.amt)}</button></div>
        <p class="reassure">Goes to Finance next. You can undo for 6 seconds.</p></div>`;
  }
  function renderPanel() {
    const p = $('#panel');
    if (MODE === 'loading') {
      p.innerHTML = `<div class="panel-body loading"><div class="p-head"><span class="skel-circle"></span><span style="flex:1;display:grid;gap:var(--space-2)"><span class="skel" style="width:50%"></span><span class="skel" style="width:70%"></span></span></div><span class="skel" style="height:var(--lh-2xl);width:40%"></span><span class="skel" style="height:var(--space-8)"></span><span class="skel" style="height:calc(var(--space-8) * 2.5)"></span></div>`;
      return;
    }
    const r = byId(S.selectedId);
    if (!r) { p.innerHTML = `<div class="panel-empty">${icon('receipt')}<p>Pick a request to see its receipt and policy check.</p></div>`; return; }
    const pol = r.policy;
    p.innerHTML = `<div class="panel-body">
      <div class="p-head"><span class="avatar avatar-lg" aria-hidden="true">${initials(r.name)}</span>
        <div class="who"><div class="name">${esc(r.name)}</div><div class="when" title="${esc(full(r.at))}">Submitted ${short(r.at)}${SEP}${ago(r.at).toLowerCase()}${days(r.at) > 1 ? ' ago' : ''}</div></div>
        <button class="btn btn-icon p-close" type="button" data-close aria-label="Close details">${icon('x')}</button></div>
      <div><div class="p-amount"><span class="big">${money(r.amt)}</span><span class="chip">${esc(r.cat)}</span></div><p class="p-desc">${esc(r.desc)}</p></div>
      <div class="policy${pol.ok ? '' : ' over'}">${icon(pol.ok ? 'check-circle' : 'alert')}<div><strong>${esc(pol.title)}</strong><span class="p-detail">${esc(pol.detail).replace(/ · /g, SEP)}</span></div></div>
      <div><h3 class="sr-only">Receipt</h3>${receiptHTML(r)}</div>
      <div><h3 class="label">Note from ${esc(first(r.name))}</h3><p class="note">${esc(r.note)}</p></div>
      <div>${track(r)}</div>
    </div>${footHTML(r)}`;
  }

  /* ---------- bulk ---------- */
  function renderBulk() {
    const ids = [...S.picked].filter(id => byId(id) && byId(id).status === 'waiting');
    S.picked = new Set(ids);
    const bar = $('#bulkbar');
    bar.hidden = ids.length === 0;
    $('#app').classList.toggle('selecting', ids.length > 0);
    if (!ids.length) return;
    const total = ids.reduce((s, id) => s + byId(id).amt, 0);
    $('#bulkSel').innerHTML = `<strong>${ids.length} selected</strong>`;
    $('#bulkApprove').textContent = `Approve ${ids.length} ${ids.length === 1 ? 'request' : 'requests'} · ${money(total)}`;
  }

  function render() { renderSummary(); renderList(); renderPanel(); renderBulk(); }

  /* ---------- toasts ---------- */
  function toast(msg, opts = {}) {
    const t = document.createElement('div');
    t.className = 'toast' + (opts.error ? ' error' : '');
    t.innerHTML = `${icon(opts.error ? 'alert' : opts.icon || 'check')}<span>${msg}</span>${opts.action ? `<button class="t-act" type="button">${opts.action}</button>` : ''}`;
    $('#toasts').appendChild(t);
    let done = false;
    const close = () => { if (done) return; done = true; t.classList.add('out'); setTimeout(() => t.remove(), 200); };
    if (opts.action) t.querySelector('.t-act').addEventListener('click', () => { close(); opts.onAction(); });
    setTimeout(close, opts.ms || UNDO_MS);
    return close;
  }

  /* ---------- actions ---------- */
  function nextAfter(id) {
    const w = waiting(); const i = w.findIndex(r => r.id === id);
    return (w[i + 1] || w[i - 1] || null);
  }
  function animateOut(ids, then) {
    const els = ids.map(id => document.querySelector(`.row[data-id="${id}"]`)).filter(Boolean);
    els.forEach(el => { el.style.height = el.offsetHeight + 'px'; });
    requestAnimationFrame(() => els.forEach(el => { el.classList.add('leaving'); el.style.height = matchMedia('(prefers-reduced-motion: reduce)').matches ? el.style.height : '0px'; }));
    setTimeout(then, els.length ? 240 : 0);
  }
  function decide(ids, status, extra) {
    const prev = ids.map(id => ({ id, ...pick(byId(id)) }));
    const focusNext = nextAfter(ids[ids.length - 1]);
    animateOut(ids, () => {
      ids.forEach(id => Object.assign(byId(id), { status, decidedAt: NOW.toISOString(), stage: 2 }, extra || {}));
      ids.forEach(id => S.picked.delete(id));
      if (ids.includes(S.selectedId)) S.selectedId = focusNext ? focusNext.id : ids[0];
      S.returning = false; S.reason = null; S.msg = '';
      render();
      const restore = () => { prev.forEach(p => Object.assign(byId(p.id), p)); S.selectedId = ids[0]; render(); toast('Restored · back in your queue', { icon: 'return', ms: 3000 }); };
      const amt = money(ids.reduce((s, id) => s + byId(id).amt, 0));
      const who = ids.length === 1 ? byId(ids[0]).name : ids.length + ' requests';
      const msg = status === 'approved' ? `Approved ${amt} for ${esc(who)}` : `Returned to ${esc(first(who))} · ${esc(extra.reason)}`;
      const closeOk = toast(msg, { action: 'Undo', onAction: restore, icon: status === 'approved' ? 'check' : 'return' });
      if (FAIL) setTimeout(() => {
        closeOk(); prev.forEach(p => Object.assign(byId(p.id), p)); S.selectedId = ids[0]; render();
        toast(`Couldn't reach Finance, so nothing was approved. ${esc(who)} is back in your queue.`, { error: true, action: 'Retry', ms: 10000, onAction: () => decide(ids, status, extra) });
      }, 900);
    });
  }
  function pick(r) { return { status: r.status, decidedAt: r.decidedAt, stage: r.stage, reason: r.reason, message: r.message }; }

  /* While a sheet or drawer is open, everything behind its scrim is inert: no focus, no clicks. */
  const behind = { panel: ['.skip', '.topbar', '#nav', '.queue'], nav: ['.skip', '.topbar', '.main'] };
  function setBehind(which, on) { behind[which].forEach(s => { const el = $(s); if (el) el.inert = on; }); }

  function openPanel(id) {
    S.selectedId = id; S.returning = false; S.reason = null; S.msg = '';
    render();
    if (narrow()) { $('#panel').classList.add('open'); $('#scrim').classList.add('on'); setBehind('panel', true); setTimeout(() => { const c = $('#panel [data-close]'); c && c.focus(); }, 50); }
  }
  function closeOverlays() {
    const wasPanel = $('#panel').classList.contains('open');
    $('#panel').classList.remove('open'); $('#nav').classList.remove('open'); $('#scrim').classList.remove('on');
    setBehind('panel', false); setBehind('nav', false);
    $('#menuBtn').setAttribute('aria-expanded', 'false');
    if (wasPanel) { const b = document.querySelector(`[data-open="${S.selectedId}"]`); b && b.focus(); }
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('button, input, [data-seg]');
    if (!t) return;
    const d = t.dataset;
    if (d.open) openPanel(d.open);
    else if (d.quick) decide([d.quick], 'approved');
    else if (d.approve) { if (narrow()) closeOverlays(); decide([d.approve], 'approved'); }
    else if (d.return) { S.returning = true; S.reason = byId(d.return).suggest || null; renderPanel(); const f = $('#panel .reasons input:checked') || $('#panel .reasons input'); f && f.focus(); }
    else if (d.cancelReturn !== undefined) { S.returning = false; S.reason = null; renderPanel(); const b = $('#panel [data-return]'); b && b.focus(); }
    else if (d.confirmReturn) { const message = (($('#retMsg') || {}).value || '').trim() || null; if (narrow()) closeOverlays(); decide([d.confirmReturn], 'returned', { reason: S.reason, message }); }
    else if (d.close !== undefined) closeOverlays();
    else if (d.clear !== undefined) { S.q = ''; $('#search').value = ''; render(); $('#search').focus(); }
    else if (d.seg) { S.seg = d.seg; document.querySelector(`input[name="seg"][value="${d.seg}"]`).checked = true; render(); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.pick) { t.checked ? S.picked.add(t.dataset.pick) : S.picked.delete(t.dataset.pick); t.closest('.row').classList.toggle('selected', t.checked); renderBulk(); renderPanel(); syncPickAll(); }
    else if (t.id === 'pickAll') { waiting().filter(matches).forEach(r => t.checked ? S.picked.add(r.id) : S.picked.delete(r.id)); renderList(); renderBulk(); renderPanel(); }
    else if (t.name === 'seg') { S.seg = t.value; renderList(); }
    else if (t.name === 'reason') { S.reason = t.value; const b = $('#panel [data-confirm-return]'); if (b) b.disabled = false; }
  });
  function syncPickAll() { const a = $('#pickAll'); if (!a) return; const w = waiting().filter(matches); const n = w.filter(r => S.picked.has(r.id)).length; a.checked = n === w.length; a.indeterminate = n > 0 && n < w.length; }
  document.addEventListener('input', e => { if (e.target.id === 'search') { S.q = e.target.value.trim(); renderList(); } else if (e.target.id === 'retMsg') S.msg = e.target.value; });
  $('#bulkClear').addEventListener('click', () => { S.picked.clear(); render(); });
  $('#bulkApprove').addEventListener('click', () => decide([...S.picked].sort((a, b) => Date.parse(byId(a).at) - Date.parse(byId(b).at)), 'approved'));
  $('#scrim').addEventListener('click', closeOverlays);
  $('#menuBtn').addEventListener('click', () => { $('#nav').classList.add('open'); $('#scrim').classList.add('on'); setBehind('nav', true); $('#menuBtn').setAttribute('aria-expanded', 'true'); $('#nav a').focus(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (S.returning) { S.returning = false; renderPanel(); } else closeOverlays(); }
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.classList.contains('row-main')) {
      const all = [...document.querySelectorAll('.row-main')]; const i = all.indexOf(e.target);
      const n = all[i + (e.key === 'ArrowDown' ? 1 : -1)]; if (n) { e.preventDefault(); n.focus(); }
    }
  });

  /* Export: a real CSV of every request */
  $('#exportBtn').addEventListener('click', () => {
    const rows = [['Employee', 'Description', 'Category', 'Amount (USD)', 'Submitted (UTC)', 'Status']]
      .concat(R.map(r => [r.name, r.desc, r.cat, (r.amt / 100).toFixed(2), r.at, r.status]));
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'pinecrest-approvals-2026-11-23.csv'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast(`Exported ${R.length} requests as CSV`, { icon: 'download', ms: 3000 });
  });

  /* Theme toggle: follows the system until the user picks */
  function themeNow() { const t = document.documentElement.dataset.theme; return t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
  function syncThemeBtn() { const dark = themeNow() === 'dark'; const b = $('#themeBtn'); b.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme'); b.dataset.tip = dark ? 'Light theme' : 'Dark theme'; b.innerHTML = icon(dark ? 'sun' : 'moon'); }
  $('#themeBtn').addEventListener('click', () => { document.documentElement.dataset.theme = themeNow() === 'dark' ? 'light' : 'dark'; syncThemeBtn(); });
  addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h === 'dark' || h === 'light') { document.documentElement.dataset.theme = h; syncThemeBtn(); } });
  addEventListener('resize', () => { if (!narrow()) closeOverlays(); });

  syncThemeBtn();
  render();
})();
</script>
</body>
</html>
